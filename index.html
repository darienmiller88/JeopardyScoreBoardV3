<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Jeopardy Score Board</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="./static/css/style.css">
    </head>
    <body>

        <nav class="navbar">
          <span class="navbar__title">Jeopardy Score Board</span>
        </nav>

        <main class="page">
          <section class="add-player">
            <label for="player-name-input" class="add-player__label">Add a contestant</label>
            <div class="add-player__row">
              <input
                type="text"
                id="player-name-input"
                class="add-player__input"
                placeholder="Type a player's name…"
                maxlength="24"
                autocomplete="off"
              >
              <button type="button" id="add-player-btn" class="btn btn--gold">Add player</button>
            </div>
            <p class="add-player__error" id="add-player-error" role="alert" aria-live="polite"></p>
          </section>

          <section class="board" id="board" aria-label="Player scores">
            <p class="board__empty" id="board-empty">No contestants yet. Add a name above to start keeping score.</p>
          </section>

        </main>

        <template id="card-template">
          <article class="card" data-name="">
            <header class="card__header">
              <h2 class="card__name"></h2>
              <button type="button" class="card__remove" aria-label="Remove player" title="Remove player">&times;</button>
            </header>

            <div class="card__score-row">
              <button type="button" class="score-btn score-btn--minus" data-action="minus100" aria-label="Subtract 100 points">&minus;<span class="score-btn__amount">100</span></button>
              <span class="card__score" data-role="score">0</span>
              <button type="button" class="score-btn score-btn--plus" data-action="plus100" aria-label="Add 100 points">+<span class="score-btn__amount">100</span></button>
            </div>

            <div class="card__custom-row">
              <button type="button" class="mini-btn mini-btn--minus" data-action="minus-custom" aria-label="Subtract custom amount">&minus;</button>
              <input
                type="number"
                class="card__custom-input"
                data-role="custom-input"
                inputmode="numeric"
                placeholder="0"
                min="0"
                max="99999"
                step="1"
                aria-label="Custom point amount"
              >
              <button type="button" class="mini-btn mini-btn--plus" data-action="plus-custom" aria-label="Add custom amount">+</button>
            </div>
          </article>
        </template>

        <script src="./static/js/script.js"></script>
    </body>
</html>
